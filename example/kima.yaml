projects:
  - type: idhi:Project
    id: idhi:project:kima
    name:
      - {language: en, value: "Kima: Place Names in the Hebrew Script"}
      - {language: he, value: "כימה: שמות מקומות בכתב עברי"}
    description:
      - language: en
        value: >-
          An open, attestation-based, historical database of place names in
          languages written in the Hebrew script. Centuries of Jewish diasporic
          existence projected their coordinate systems on the world map; Hebrew
          languages interacted with local contemporaneous place names wherever
          Jewish people dwelled, and diverging cultural, Halachic and liturgical
          traditions created toponymic categories at once anchored in geography
          and mutable by time and culture. Kima provides a comprehensive, dynamic
          and interoperable gazetteer that serves as a stable, shared reference
          for linking place names in digitized resources. Being grounded in
          textual attestations, it enables — beyond the study, visualization and
          use of changing historical place names — the study of place names as a
          linguistic, discursive phenomenon. Kima currently holds 48,124 places,
          150,018 name variants and 235,867 attestations, available on the
          website, via an API, in Recogito, in the DiJeSt triplestore, and as an
          OpenRefine reconciliation service. Kima was founded with seed
          funding from two Pelagios Commons Resource Grants (2016–2017); since
          then it has been developed and maintained pro bono by Sinai Rusinek
          and Gil Shalit (dh-dev.com), with no institutional host or ongoing funding.
      - language: he
        value: >-
          מסד נתונים היסטורי, פתוח ומבוסס־היקרויות של שמות מקומות בלשונות
          הנכתבות בכתב עברי. כימה מספקת גזטיר מקיף, דינמי ובר־פעולה הדדית
          המשמש נקודת ייחוס יציבה ומשותפת לקישור שמות מקומות במשאבים דיגיטליים,
          ומאפשר, מעבר לחקר שמות מקומות משתנים, את חקר השם כתופעה לשונית
          ושיחית. הפרויקט הוקם בסיוע שני מענקים ראשוניים מטעם Pelagios Commons
          (2016–2017), ומאז הוא מפותח ומתוחזק בהתנדבות על ידי סיני רוסינק וגיל
          שליט (dh-dev.com), ללא מוסד מארח וללא מימון שוטף.
