projects:
  - type: idhi:Project
    id: idhi:project:hebnewsocr
    name:
      - {language: en, value: "Improved OCR Corpus of Mid-20th-Century Hebrew Newspapers"}
      - {language: he, value: "קורפוס OCR משופר של עיתונות עברית מאמצע המאה העשרים"}
    description:
      - language: en
        value: >-
          A series of consecutive projects to improve the OCR of digitised
          historical Hebrew newspapers from the Historical Jewish Press (JPress)
          collection of the National Library of Israel and Tel Aviv University,
          whose two decades of digitisation left OCR of uneven quality that
          impedes advanced text analysis. Segmented newspaper pages were re-read
          with trained models: a first pipeline built at the Open University's
          OMILab on the Transkribus platform, then ported to the open-source
          Kraken engine. The resulting corpus — over 2.6 million items (articles
          and advertisements) from 17,957 issues of five Israeli dailies: Maariv,
          Davar, Herut, Haboker and Hayom — was prepared as a research corpus for
          the ISF project "The Double Movement? Towards a Socioeconomic
          Historiography of the Right in Israel (1948–1984)", led by Prof. Amir
          Goldstein (Tel-Hai Academic College), which funded the OCR work.
          ivrit.ai helped pro bono with the pipeline and published the dataset
          on Hugging Face, where it is openly available for text analysis and
          for further OCR training.
      - language: he
        value: >-
          סדרת פרויקטים לשיפור ה־OCR של עיתונים עבריים היסטוריים מאוסף "עיתונות
          יהודית היסטורית" (JPress) של הספרייה הלאומית ואוניברסיטת תל אביב.
          עמודי עיתון מפולחים נקראו מחדש באמצעות מודלים מאומנים — תחילה
          בפלטפורמת Transkribus במעבדת OMILab של האוניברסיטה הפתוחה, ולאחר מכן
          במנוע הקוד הפתוח Kraken. הקורפוס — למעלה מ־2.6 מיליון פריטים (כתבות
          ומודעות) מ־17,957 גיליונות של חמישה יומונים: מעריב, דבר, חרות, הבוקר
          והיום — הוכן כקורפוס מחקר לפרויקט ISF "התנועה הכפולה? לקראת
          היסטוריוגרפיה חברתית־כלכלית של הימין בישראל (1984–1948)" בראשות פרופ'
          אמיר גולדשטיין (המכללה האקדמית תל־חי), שמימן את עבודת ה־OCR. ivrit.ai
          סייעה בהתנדבות בבניית הצינור והעלתה את מאגר הנתונים ל־Hugging Face, שם
          הוא זמין באופן פתוח.
    homepage: https://huggingface.co/datasets/yoad/heb_news_ocr_corpus_transformed
    additional_urls:
      - https://huggingface.co/datasets/yoad/heb_news_ocr_corpus
      - https://docs.google.com/document/d/1bUV5CyuYvgyJIU_IoIjqwd-oMtuwEB55qdGnuyj_258/
      - https://www.openu.ac.il/en/omilab/pages/historicalnewspaper
      - https://www.nli.org.il/en/discover/newspapers/jpress
    digital_humanities_activities:
      - tadirah:opticalCharacterRecognition
      - tadirah:segmenting
      - tadirah:machineLearning
      - tadirah:dataCleansing
      - tadirah:converting
      - tadirah:disseminating
    research_disciplines:
      - {language: en, value: History of the press}
      - {language: en, value: Israeli history}
      - {language: en, value: Computational linguistics}
    tags:
      - OCR
      - Kraken
      - Transkribus
      - historical newspapers
      - JPress
      - Hebrew
      - corpus
      - Hugging Face
      - Maariv
      - Davar
      - Herut
      - Haboker
      - Hayom
    end_date: "2025-05-10"
    studied_periods:
      - {language: en, value: 1925–1969}
      - {language: he, value: 1969–1925}
    studied_places:
      - {language: en, value: Mandatory Palestine and Israel}
      - {language: he, value: ארץ ישראל המנדטורית ומדינת ישראל}
      - {language: ar, value: فلسطين الانتدابية وإسرائيل}
    organization_roles:
      - organization: idhi:organization:telhai
        project: idhi:project:hebnewsocr
        org_project_role: HOST
      - organization: idhi:organization:omilab
        project: idhi:project:hebnewsocr
        org_project_role: PARTNER
      - organization: idhi:organization:ivritai
