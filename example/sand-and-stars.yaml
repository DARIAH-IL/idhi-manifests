projects:
  - type: idhi:Project
    id: idhi:project:sandstars
    name:
      - {language: en, value: "Sand and Stars: Synoptic Digital Edition of Siddy Wronsky's Novel"}
      - {language: de, value: "Sand und Sterne: Synoptische digitale Edition von Siddy Wronskys Roman"}
      - {language: he, value: "חול וכוכבים: מהדורה דיגיטלית סינופטית של הרומן מאת סידי ורונסקי"}
    description:
      - language: en
        value: >-
          Digitisation and scholarly edition of "Sand und Sterne", an unpublished
          novel written in the late 1930s by the social-work pioneer Siddy
          (Sidonie) Wronsky (Berlin 1883 – Jerusalem 1947), narrating the flight
          of four young Jews from Nazi Germany to Mandatory Palestine. The
          edition presents three parallel versions — the German original
          manuscript, a Hebrew translation by Yossef Achai, and an anonymous
          English translation — aligned at the sub-sentence level in TEI XML and
          published as a synoptic edition in TEI Publisher, with a parallel
          open-access print edition (Nomos, 2025). The TEI sources are
          archived on Zenodo and on GitHub. Led by the Deutsches Zentralinstitut
          für soziale Fragen (DZI), Berlin, with partners in Jerusalem, Haifa
          and Berlin; funded by the State of Berlin's digitisation programme
          via digiS.
      - language: he
        value: >-
          דיגיטציה ומהדורה מדעית של "חול וכוכבים", רומן גנוז שכתבה בסוף שנות
          השלושים חלוצת העבודה הסוציאלית סידי ורונסקי (ברלין 1883 – ירושלים
          1947), המתאר את בריחתם של ארבעה צעירים יהודים מגרמניה הנאצית לארץ
          ישראל המנדטורית. המהדורה מציגה זו לצד זו שלוש גרסאות — כתב היד הגרמני
          המקורי, תרגום לעברית מאת יוסף אחאי ותרגום אנונימי לאנגלית — מיושרות
          ברמת תת־המשפט ב־TEI XML ומוגשות כמהדורה סינופטית ב־TEI Publisher,
          לצד מהדורה מודפסת בגישה פתוחה (Nomos, 2025).
    homepage: https://sand-and-stars.dzi.de:8443/exist/apps/Sand-and-Stars/index.html
    additional_urls:
      - https://www.dzi.de/ueber-uns/geschichte/digitalisierungsprojekt-sand-und-sterne/
      - https://github.com/sinairusinek/Sand-and-Stars
      - https://doi.org/10.5281/zenodo.18704331
    digital_humanities_activities:
      - tadirah:transcribing
      - tadirah:encoding
      - tadirah:editing
      - tadirah:sequenceAlignment
      - tadirah:translating
      - tadirah:publishing
    research_disciplines:
      - {language: en, value: History of social work}
      - {language: en, value: German-Jewish literature}
      - {language: en, value: Jewish history}
      - {language: en, value: Translation studies}
    tags:
      - TEI
      - TEI Publisher
      - digital edition
      - synoptic edition
      - documentary edition
      - Siddy Wronsky
      - Zionism
      - migration
      - gender
    end_date: "2025-12-31"
    studied_periods:
      - {language: en, value: 1930s}
      - {language: he, value: שנות השלושים של המאה העשרים}
    studied_places:
      - {language: en, value: Germany}
      - {language: he, value: גרמניה}
      - {language: en, value: Mandatory Palestine}
      - {language: he, value: ארץ ישראל המנדטורית}
      - {language: ar, value: فلسطين الانتدابية}
    organization_roles:
