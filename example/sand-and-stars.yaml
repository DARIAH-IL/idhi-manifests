  - type: idhi:Organization
    id: idhi:organization:elijahlab
    name:
      - {language: en, value: "The Eliyahu Lab (e-Lijah Lab) – Laboratory and Incubator for Digital Humanities, University of Haifa"}
      - {language: he, value: "מעבדת אליהו – מעבדה וחממה למדעי הרוח הדיגיטליים, אוניברסיטת חיפה"}
    description:
      - language: en
        value: >-
          A digital humanities space at the University of Haifa, operating within
          the Department of Jewish History, Jewish Thought and the Bible. The lab
          conducts research, development and knowledge accessibility in Jewish
          studies with advanced technological tools — data processing, historical
          mapping, knowledge modelling, digital preservation of manuscripts and
          historical sources, AI and machine learning, and network analysis —
          and serves as an incubator for DH methods beyond Jewish studies, in
          other humanities fields and in education, law and society. It offers
          advice and support at all stages of DH research, from idea and grant
          proposal to tool development, database creation and public access.
          Headed by Prof. Moshe Lavee; home of the Haifa team of the ERC Synergy
          project MIDRASH.
      - language: he
        value: >-
          מרחב למדעי הרוח הדיגיטליים באוניברסיטת חיפה, הפועל במסגרת החוג
          להיסטוריה של עם ישראל, מחשבת ישראל ומקרא. המעבדה עוסקת במחקר, בפיתוח
          ובהנגשת ידע בתחומי מדעי היהדות תוך שילוב כלים טכנולוגיים מתקדמים —
          עיבוד נתונים, מיפוי היסטורי, מידול ידע, שימור דיגיטלי של כתבי יד
          ומקורות היסטוריים, בינה מלאכותית, למידת מכונה וניתוח רשתות — ומשמשת
          חממה ליישום כלי מדעי הרוח הדיגיטליים גם מחוץ למדעי היהדות. בראשות
          פרופ' משה לביא.
    organization_type: RESEARCH_CENTER
    parent_organization: idhi:organization:haifa
    homepage: https://elijahlab.haifa.ac.il/
    location:
