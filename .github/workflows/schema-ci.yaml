name: schema-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Sanity pipeline (lint, materialize, generate)
        run: ./scripts/sanity.sh

      - name: Upload generated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: idhi-gen
          path: |
            build/
            gen/

      - name: Fetch pages deployment branch
        run: git fetch origin gh-pages:refs/remotes/origin/gh-pages

      - name: Deploy pages
        run: uv run mkdocs gh-deploy
